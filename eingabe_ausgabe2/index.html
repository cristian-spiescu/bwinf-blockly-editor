    <script>
        let isLeftDragging = false;
        let isRightDragging = false;

        function ResetColumnSizes() {
            // when page resizes return to default col sizes
            let page = document.getElementById("pageFrame");
            page.style.gridTemplateColumns = "2fr 1px 6fr 1px 0px";
        }

        function SetCursor(cursor) {
            let page = document.getElementById("page");
            page.style.cursor = cursor;
        }

        function StartLeftDrag() {
            console.log("mouse down");
            isLeftDragging = true;

            SetCursor("ew-resize");
        }

        function StartRightDrag() {
            console.log("mouse down");
            isRightDragging = true;

            SetCursor("ew-resize");
        }

        function EndDrag() {
            console.log("mouse up");
            isLeftDragging = false;
            isRightDragging = false;

            SetCursor("auto");
        }

        function OnDrag(event) {
            if (isLeftDragging || isRightDragging) {
                console.log("Dragging");
                //console.log(event);

                let page = document.getElementById("page");
                let leftcol = document.getElementById("blocklyArea");
                let rightcol = document.getElementById("rightcol");

                let leftColWidth = isLeftDragging ? event.clientX : leftcol.clientWidth;
                let rightColWidth = isRightDragging ? page.clientWidth - event.clientX : rightcol.clientWidth;

                let dragbarWidth = 2;

                let cols = [
                    leftColWidth,
                    dragbarWidth,
                    page.clientWidth - (2 * dragbarWidth) - leftColWidth - rightColWidth,
                    dragbarWidth,
                    rightColWidth
                ];

                let newColDefn = cols.map(c => c.toString() + "px").join(" ");

                console.log(newColDefn);
                page.style.gridTemplateColumns = newColDefn;

                event.preventDefault()
                window.dispatchEvent(new Event('resize'));


            }
        }
    </script>

                    x = hashlist[0];

        Blockly.Blocks['read_int'] = {
            init: function () {

                    .appendField("lies Zeile als ganze Zahl");

        var toolbox = document.getElementById("toolbox");
        var blocklyArea = document.getElementById('blocklyArea');

            css: true,
            media: 'blockly/media/',
            sounds: true,
            oneBasedIndex: true,
        };

        var workspace = Blockly.inject(blocklyArea, options);
        Blockly.svgResize(workspace);

        var xml_text = localStorage.getItem('bwinf361j1code');
        if (xml_text) {
            var xml = Blockly.Xml.textToDom(xml_text);
            Blockly.Xml.domToWorkspace(xml, workspace);
        }
        var own_code = localStorage.getItem('bwinf361j1code_own');
        if (own_code) {
            editor_own.setValue(own_code, 1);
        }

        function myUpdateFunction(event) {
            var code = Blockly.JavaScript.workspaceToCode(workspace);
            editor_gen.setValue(code, 1);

            // Save Blocks
            var xml = Blockly.Xml.workspaceToDom(workspace);
            var xml_text = Blockly.Xml.domToText(xml);
            localStorage.setItem('bwinf361j1code', xml_text);
            localStorage.setItem('bwinf361j1code_own', editor_own.getValue());
        }
        workspace.addChangeListener(myUpdateFunction);
        editor_own.getSession().on('change', myUpdateFunction);

        var grid = {
            write: function (x, y, val) {
                var id = 'f' + x + '_' + y;
                document.getElementById(id).textContent = val;
            },
            read: function (x, y) {
                var id = 'f' + x + '_' + y;
                return document.getElementById(id).textContent;
            },
            colourise: function (x, y, colour) {
                var id = 'f' + x + '_' + y;
                document.getElementById(id).parentNode.style.backgroundColor = colour;
                document.getElementById(id).style.backgroundColor = colour;
            }
        }

        var output_result = "";
        var output = {
            write: function (val) {
                output_result += val + "\n";
            },
        }

        var canvasEl = document.getElementById('drawing_canvas');
        var ctx = canvasEl.getContext('2d');

        function resizeCanvas() {
            var pane = document.getElementById('outputPane');
            var w = Math.floor(pane.clientWidth);
            var h = Math.floor(pane.clientHeight);
            if (w <= 0 || h <= 0) {
                return;
            }
            // Setting width/height resets drawing state; only do it when size changes.
            if (canvasEl.width !== w || canvasEl.height !== h) {
                canvasEl.width = w;
                canvasEl.height = h;
            }
        }

        function clearCanvas() {
            ctx.save();
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
            ctx.restore();
        }

        function resetCanvasTransform() {
            ctx.setTransform(1, 0, 0, 1, 0, 0);
        }

        function changeOutputView() {
            var view = document.getElementById('outputView').value;
            var isCanvas = view === 'canvas';
            document.getElementById('output_area').style.visibility = isCanvas ? 'hidden' : 'visible';
            canvasEl.style.display = isCanvas ? 'block' : 'none';
            document.getElementById('outputLabel').textContent = isCanvas ? 'Canvas' : 'Ausgabefeld';
            if (isCanvas) {
                resizeCanvas();
            }
        }
        document.getElementById('outputView').addEventListener('change', changeOutputView, false);
        window.addEventListener('resize', function () {
            if (document.getElementById('outputView').value === 'canvas') {
                resizeCanvas();
            }
        });

        var saved_input = "";
        var input_index = 0;
        var input = {
            commonRead: function () {
                var index = saved_input.indexOf('\n', input_index);
                if (index < 0) {
                    index = saved_input.length;
                }

                var result = saved_input.substring(input_index, index);
                input_index = index + 1;
                return result;
            },

            read_string: function () {
                return this.commonRead();
            },

            read_int: function () {
                return parseInt(this.commonRead());
            },

            read_float: function () {
                return parseFloat(this.commonRead());
            },

            is_end_of_file: function () {
                var index = saved_input.indexOf('\n', input_index);

                return index < 0;
            },
        }
        input.read_integer = input.read_int;


        Blockly.JavaScript['write'] = function (block) {
            var text = Blockly.JavaScript.valueToCode(block, 'text', Blockly.JavaScript.ORDER_NONE);
            var code = 'output.write(' + text + ');\n';
            return code;
        };

        Blockly.JavaScript['read_string'] = function (block) {
            var code = 'input.read_string()';
            return [code, Blockly.JavaScript.ORDER_MEMBER];
        };
        Blockly.JavaScript['read_int'] = function (block) {
            var code = 'input.read_int()';
            return [code, Blockly.JavaScript.ORDER_MEMBER];
        };
        Blockly.JavaScript['read_float'] = function (block) {

            return [code, Blockly.JavaScript.ORDER_MEMBER];

            return [code, Blockly.JavaScript.ORDER_MEMBER];
        };
        Blockly.JavaScript['string_to_int'] = function (block) {
            var text = Blockly.JavaScript.valueToCode(block, 'text', Blockly.JavaScript.ORDER_NONE);
            var code = 'parseInt(' + text + ')';
            return [code, Blockly.JavaScript.ORDER_MEMBER];
        };

        Blockly.JavaScript['canvas_begin_path'] = function (block) {
            return 'ctx.beginPath();\n';
        };
        Blockly.JavaScript['canvas_move_to'] = function (block) {
            var x = Blockly.JavaScript.valueToCode(block, 'X', Blockly.JavaScript.ORDER_COMMA) || '0';
            var y = Blockly.JavaScript.valueToCode(block, 'Y', Blockly.JavaScript.ORDER_COMMA) || '0';
            return 'ctx.moveTo(' + x + ', ' + y + ');\n';
        };
        Blockly.JavaScript['canvas_line_to'] = function (block) {
            var x = Blockly.JavaScript.valueToCode(block, 'X', Blockly.JavaScript.ORDER_COMMA) || '0';
            var y = Blockly.JavaScript.valueToCode(block, 'Y', Blockly.JavaScript.ORDER_COMMA) || '0';

        Blockly.JavaScript['canvas_stroke_style'] = function (block) {
            var colour = Blockly.JavaScript.valueToCode(block, 'COLOUR', Blockly.JavaScript.ORDER_ASSIGNMENT) || "'black'";

        };
        Blockly.JavaScript['canvas_line_width'] = function (block) {
            var width = Blockly.JavaScript.valueToCode(block, 'WIDTH', Blockly.JavaScript.ORDER_ASSIGNMENT) || '1';
            return 'ctx.lineWidth = ' + width + ';\n';
        };
        Blockly.JavaScript['canvas_stroke'] = function (block) {

        Blockly.JavaScript['canvas_arc'] = function (block) {

        function myRunFunction() {
            saved_input = document.getElementById("input_area").value;
            input_index = 0;

            Blockly.JavaScript.addReservedWords('code');
            Blockly.JavaScript.addReservedWords('ctx');
            Blockly.JavaScript.addReservedWords('clearCanvas');
            var code = Blockly.JavaScript.workspaceToCode(workspace);

            if (document.getElementById('editor').value == "ownJs") {
                code = editor_own.getValue();
            }

            // Show the canvas when the program draws on it.
            if (/\bctx\b/.test(code) || /\bclearCanvas\b/.test(code)) {
                document.getElementById('outputView').value = 'canvas';
                changeOutputView();
            } else {
                resizeCanvas();
            }

            // Each run starts with identity transform; translate/scale then apply for later draws.
            resetCanvasTransform();

            console.log(code);
            try {
                eval(code);
            } catch (e) {
                alert(e);
            }

            document.getElementById('input_area').value = saved_input.substring(input_index);
            document.getElementById("output_area").value = output_result;
        }
        document.getElementById("runButton").onclick = myRunFunction;

        function myClearFunction() {
            document.getElementById('input_area').value = saved_input;
            document.getElementById('output_area').value = "";
            output_result = "";
            clearCanvas();
        }

            var xml = Blockly.Xml.workspaceToDom(workspace);

                'programm.blockly.xml');
        }
        document.getElementById("saveButton").onclick = mySaveFunction;


        function readSingleFile(e) {
            var file = e.target.files[0];
            if (!file) {
                return;
            }
            var reader = new FileReader();
            reader.onload = function (e) {
                var xml_text = e.target.result;
                if (xml_text) {
                    var xml = Blockly.Xml.textToDom(xml_text);
                    Blockly.Xml.domToWorkspace(xml, workspace);
                }
            };
            reader.readAsText(file);
        }
        document.getElementById('fileButton').addEventListener('change', readSingleFile, false);


        function changeEditor(e) {
            document.getElementById('blocklyArea').style.display = "none";
            document.getElementById('genJs').style.display = "none";
            document.getElementById('ownJs').style.display = "none";

            document.getElementById(document.getElementById('editor').value).style.display = "block";

            editor_own.resize();
            editor_gen.resize();
            Blockly.svgResize(workspace);

        }
        document.getElementById('editor').addEventListener('change', changeEditor, false);

        // Speichern des Ausgabefeldes
        function saveOutputToFile() {
            const outputText = document.getElementById("output_area").value;
            const blob = new Blob([outputText], {
                type: "text/plain"
            });
            const url = URL.createObjectURL(blob);

            const a = document.createElement("a");
            a.href = url;
            a.download = "ausgabe.txt";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
        document.getElementById("saveOutputButton").onclick = saveOutputToFile;

        // Beide Textfelder leeren
        function clearBothFunction() {
            document.getElementById("input_area").value = "";
            document.getElementById("output_area").value = "";
            output_result = "";
            saved_input = "";
            input_index = 0;
            clearCanvas();
        }
        document.getElementById("clearBothButton").onclick = clearBothFunction;

        // Datei per Button ins Eingabefeld laden
        document.getElementById("inputFileLoader").addEventListener("change", function (e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (evt) {
                let text = evt.target.result;
                if (!text.endsWith("\n")) text += "\n";
                document.getElementById("input_area").value = text;
            };
            reader.readAsText(file);
        });

        // Drag & Drop für Eingabefeld
        const inputArea = document.getElementById("input_area");
        inputArea.addEventListener("dragover", function (e) {
            e.preventDefault();
            inputArea.style.border = "2px dashed blue";
        });
        inputArea.addEventListener("dragleave", function (e) {
            e.preventDefault();
            inputArea.style.border = "";
        });
        inputArea.addEventListener("drop", function (e) {
            e.preventDefault();
            inputArea.style.border = "";
            const file = e.dataTransfer.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (evt) {
                    let text = evt.target.result;
                    if (!text.endsWith("\n")) text += "\n";
                    inputArea.value = text;
                };
                reader.readAsText(file);
            }
        });
