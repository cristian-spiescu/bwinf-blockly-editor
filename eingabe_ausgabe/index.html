<html>
  <head>
    <title>BwInf Eingabe_Ausgabe mit Blockly</title>
    <meta charset="utf-8">
    <style>
        table {  padding:0px;margin:0px; background-color: lightgrey;}
        tbody {  padding:0px;margin:0px;}
        tr {padding:0px; margin:0px; border:none;}
        td {height: 60px; width: 60px; margin:0px; padding:0px; border:none;  text-align:center; vertical-align:middle; background-color:white; }
        .field {width: 60px;}

        html, body {
          padding: 0;
          margin: 0;
        }

        #run {position:fixed; right:380px; top:10px; width:80px; height:35px; background-color: salmon;border: 1px solid darkred;}
        #clear {position:fixed; right:290px; top:10px; width:80px; height:35px; background-color: lightgray;border: 1px solid darkgrey;}
        #save {position:fixed; right:200px; top:10px; width:80px; height:35px; background-color: lightgreen;border: 1px solid darkgreen;}
        #load {position:fixed; right:10px; top:10px; width:180px; height:35px; background-color: white;border: none; text-align:center; font-family:sans-serif;}

        #container {
          width:100vw;
          height:100vh;
          display: -ms-grid;
          display: grid;
          -ms-grid-columns: 50% 50%;
          -ms-grid-rows: 75px 90%;
          grid-template-columns: 50% 50%;
          grid-template-rows: 75px auto;
          grid-template-areas:
            "menubar     menubar"
            "blockly     grid"
        }

        #menubar      {background:#a9d0f7; grid-area: menubar; font-family: sans-serif; font-size: 18px; padding: 5px 10px; display: -ms-grid; display: grid; grid-template-columns: auto auto auto auto auto; -ms-grid-row:1;-ms-grid-column:1; -ms-grid-column-span:2;  -ms-grid-columns: 20% 20% 20% 20% 20%; }
        #blocklyArea  {grid-area: blockly; -ms-grid-row:2;-ms-grid-column:1; height: calc(100vh - 75px);}
        #grid         {grid-area: grid; margin:0px;  -ms-grid-row:2;-ms-grid-column:2;
          display: -ms-grid;
          display: grid;
          -ms-grid-rows: 50% 50%;
          grid-template-rows: 50% 50%;
        }

        textarea {width:100%;height:calc(100% - 2px);resize: none;}
        .textarealabel {
          position:absolute;
          right:20px;
          top:10px;
          font-size:300%;
          font-family:sans-serif;
          color:lightgrey;
        }
    </style>

    <script src="blockly/blockly_compressed.js"></script>
    <script src="blockly/blocks_compressed.js"></script>
    <script src="blockly/javascript_compressed.js"></script>
    <script src="blockly/msg/js/de.js"></script>
  </head>
  <body>
    <div id="container">
      <div id="menubar">
        <div>Ansicht: <select id="editor">
          <option value="blocklyArea">Blockly</option>
          <option value="genJs">Generiertes Javascript</option>
          <option value="ownJs">Eigenes Javascript</option>
        </select></div>
        <div><span id="runText">▶ Programm ausführen: </span> <input type="button" value="Ausführen" id="runButton" /></div>
        <div><span id="clearText">□ Textfelder zurücksetzen: </span> <input type="button" value="Zurücksetzen" id="clearButton" /></div>
        <div><span id="saveText">💾 Bausteine speichern:</span> <input type="button" value="Speichern" id="saveButton" /></div>
        <div><span id="loadText">📂 Bausteine öffnen:</span> <input type="file" id="fileButton" style="max-width:200px" /></div>
      </div>
      <div id="blocklyArea"></div>
      <div id="genJs" style="display:none; font-size: 12pt;"></div>
      <div id="ownJs" style="display:none; font-size: 12pt;"></div>
      <div id="grid">
        <div style="position:relative">
        <div class="textarealabel">Eingabefeld</div>
        <textarea id="input_area"></textarea>

        </div>
        <div style="position:relative">
        <div class="textarealabel">Ausgabefeld</div>
        <textarea readonly id="output_area"></textarea>
        </div>
      </div>
    </div>


  <xml id="toolbox" style="display: none">
    <category name="Ein-/Ausgabe" colour="60">
      <block type="write"></block>
      <block type="read_string"></block>
      <block type="read_float"></block>
      <block type="end_of_file"></block>
      <block type="string_to_float"></block>
    </category>
    <category name="Logik" colour="210">
      <block type="controls_if"></block>
      <block type="logic_compare"></block>
      <block type="logic_operation"></block>
      <block type="logic_negate"></block>
      <block type="logic_boolean"></block>
      <block type="logic_null"></block>
      <block type="logic_ternary"></block>
    </category>
    <category name="Schleifen" colour="120">
      <block type="controls_repeat_ext">
        <value name="TIMES">
          <shadow type="math_number">
            <field name="NUM">10</field>
          </shadow>
        </value>
      </block>
      <block type="controls_whileUntil"></block>
      <block type="controls_for">
        <value name="FROM">
          <shadow type="math_number">
            <field name="NUM">1</field>
          </shadow>
        </value>
        <value name="TO">
          <shadow type="math_number">
            <field name="NUM">10</field>
          </shadow>
        </value>
        <value name="BY">
          <shadow type="math_number">
            <field name="NUM">1</field>
          </shadow>
        </value>
      </block>
      <block type="controls_forEach"></block>
      <block type="controls_flow_statements"></block>
    </category>
    <category name="Mathematik" colour="230">
      <block type="math_number"></block>
      <block type="math_arithmetic">
        <value name="A">
          <shadow type="math_number">
            <field name="NUM">1</field>
          </shadow>
        </value>
        <value name="B">
          <shadow type="math_number">
            <field name="NUM">1</field>
          </shadow>
        </value>
      </block>
      <block type="math_single">
        <value name="NUM">
          <shadow type="math_number">
            <field name="NUM">9</field>
          </shadow>
        </value>
      </block>
      <block type="math_trig">
        <value name="NUM">
          <shadow type="math_number">
            <field name="NUM">45</field>
          </shadow>
        </value>
      </block>
      <block type="math_constant"></block>
      <block type="math_number_property">
        <value name="NUMBER_TO_CHECK">
          <shadow type="math_number">
            <field name="NUM">0</field>
          </shadow>
        </value>
      </block>
      <block type="math_round">
        <value name="NUM">
          <shadow type="math_number">
            <field name="NUM">3.1</field>
          </shadow>
        </value>
      </block>
      <block type="math_on_list"></block>
      <block type="math_modulo">
        <value name="DIVIDEND">
          <shadow type="math_number">
            <field name="NUM">64</field>
          </shadow>
        </value>
        <value name="DIVISOR">
          <shadow type="math_number">
            <field name="NUM">10</field>
          </shadow>
        </value>
      </block>
      <block type="math_constrain">
        <value name="VALUE">
          <shadow type="math_number">
            <field name="NUM">50</field>
          </shadow>
        </value>
        <value name="LOW">
          <shadow type="math_number">
            <field name="NUM">1</field>
          </shadow>
        </value>
        <value name="HIGH">
          <shadow type="math_number">
            <field name="NUM">100</field>
          </shadow>
        </value>
      </block>
      <block type="math_random_int">
        <value name="FROM">
          <shadow type="math_number">
            <field name="NUM">1</field>
          </shadow>
        </value>
        <value name="TO">
          <shadow type="math_number">
            <field name="NUM">100</field>
          </shadow>
        </value>
      </block>
      <block type="math_random_float"></block>
    </category>
    <category name="Text" colour="160">
      <block type="text"></block>
      <block type="text_join"></block>
      <block type="text_append">
        <value name="TEXT">
          <shadow type="text"></shadow>
        </value>
      </block>
      <block type="text_length">
        <value name="VALUE">
          <shadow type="text">
            <field name="TEXT">abc</field>
          </shadow>
        </value>
      </block>
      <block type="text_isEmpty">
        <value name="VALUE">
          <shadow type="text">
            <field name="TEXT"></field>
          </shadow>
        </value>
      </block>
      <block type="text_indexOf">
        <value name="VALUE">
          <block type="variables_get">
            <field name="VAR">text</field>
          </block>
        </value>
        <value name="FIND">
          <shadow type="text">
            <field name="TEXT">abc</field>
          </shadow>
        </value>
      </block>
      <block type="text_charAt">
        <value name="VALUE">
          <block type="variables_get">
            <field name="VAR">text</field>
          </block>
        </value>
      </block>
      <block type="text_getSubstring">
        <value name="STRING">
          <block type="variables_get">
            <field name="VAR">text</field>
          </block>
        </value>
      </block>
      <block type="text_changeCase">
        <value name="TEXT">
          <shadow type="text">
            <field name="TEXT">abc</field>
          </shadow>
        </value>
      </block>
      <block type="text_trim">
        <value name="TEXT">
          <shadow type="text">
            <field name="TEXT">abc</field>
          </shadow>
        </value>
      </block>
      <block type="text_print">
        <value name="TEXT">
          <shadow type="text">
            <field name="TEXT">abc</field>
          </shadow>
        </value>
      </block>
      <block type="text_prompt_ext">
        <value name="TEXT">
          <shadow type="text">
            <field name="TEXT">abc</field>
          </shadow>
        </value>
      </block>
    </category>
    <category name="Listen" colour="260">
      <block type="lists_create_with">
        <mutation items="0"></mutation>
      </block>
      <block type="lists_create_with"></block>
      <block type="lists_repeat">
        <value name="NUM">
          <shadow type="math_number">
            <field name="NUM">5</field>
          </shadow>
        </value>
      </block>
      <block type="lists_length"></block>
      <block type="lists_isEmpty"></block>
      <block type="lists_indexOf">
        <value name="VALUE">
          <block type="variables_get">
            <field name="VAR">liste</field>
          </block>
        </value>
      </block>
      <block type="lists_getIndex">
        <value name="VALUE">
          <block type="variables_get">
            <field name="VAR">liste</field>
          </block>
        </value>
      </block>
      <block type="lists_setIndex">
        <value name="LIST">
          <block type="variables_get">
            <field name="VAR">liste</field>
          </block>
        </value>
      </block>
      <block type="lists_getSublist">
        <value name="LIST">
          <block type="variables_get">
            <field name="VAR">liste</field>
          </block>
        </value>
      </block>
      <block type="lists_split">
        <value name="DELIM">
          <shadow type="text">
            <field name="TEXT">,</field>
          </shadow>
        </value>
      </block>
      <block type="lists_sort"></block>
    </category>
    <category name="Farbe" colour="20">
      <block type="colour_picker"></block>
      <block type="colour_random"></block>
      <block type="colour_rgb">
        <value name="RED">
          <shadow type="math_number">
            <field name="NUM">100</field>
          </shadow>
        </value>
        <value name="GREEN">
          <shadow type="math_number">
            <field name="NUM">50</field>
          </shadow>
        </value>
        <value name="BLUE">
          <shadow type="math_number">
            <field name="NUM">0</field>
          </shadow>
        </value>
      </block>
      <block type="colour_blend">
        <value name="COLOUR1">
          <shadow type="colour_picker">
            <field name="COLOUR">#ff0000</field>
          </shadow>
        </value>
        <value name="COLOUR2">
          <shadow type="colour_picker">
            <field name="COLOUR">#3333ff</field>
          </shadow>
        </value>
        <value name="RATIO">
          <shadow type="math_number">
            <field name="NUM">0.5</field>
          </shadow>
        </value>
      </block>
    </category>
    <sep></sep>
    <category name="Variablen" colour="330" custom="VARIABLE"></category>
    <category name="Funktionen" colour="290" custom="PROCEDURE"></category>
  </xml>

  </body>

  <script src="ace/ace.js" type="text/javascript" charset="utf-8"></script>
  <script>
      var editor_gen = ace.edit("genJs");
      editor_gen.$blockScrolling = Infinity;
      editor_gen.setReadOnly(true);
      editor_gen.setTheme("ace/theme/xcode");
      editor_gen.getSession().setMode("ace/mode/javascript");
      var editor_own = ace.edit("ownJs");
      editor_own.$blockScrolling = Infinity;
      editor_own.setTheme("ace/theme/xcode");
      editor_own.getSession().setMode("ace/mode/javascript");

    var x = 100;
    var y = 100;
    var hash = window.location.hash;
    if (hash) {
        var hashlist = hash.substr(1).split(",");
        if (hashlist.length == 2) {
            if (hashlist[0] > 0 && hashlist[0] < 10000 && hashlist[1] > 0 && hashlist[1] < 10000) {
                x = hashlist[0];
                y = hashlist[1];
            }
        }
    }

    Blockly.Blocks['read_int'] = {
      init: function() {
        this.appendDummyInput()
            .appendField("lies Zeile als ganze Zahl");
        this.setOutput(true, "Number");
        this.setColour(15);
        this.setTooltip("");
        this.setHelpUrl("");
      }
    };

    Blockly.Blocks['read_float'] = {
      init: function() {
        this.appendDummyInput()
            .appendField("lies Zeile als Zahl");
        this.setOutput(true, "Number");
        this.setColour(15);
        this.setTooltip("");
        this.setHelpUrl("");
      }
    };

    Blockly.Blocks['read_string'] = {
      init: function() {
        this.appendDummyInput()
            .appendField("lies Zeile als Text");
        this.setOutput(true, "String");
        this.setColour(15);
        this.setTooltip("");
        this.setHelpUrl("");
      }
    };

    Blockly.Blocks['end_of_file'] = {
      init: function() {
        this.appendDummyInput()
            .appendField("Ende der Eingabe");
        this.setOutput(true, "Boolean");
        this.setColour(15);
        this.setTooltip("");
        this.setHelpUrl("");
      }
    };

    Blockly.Blocks['write'] = {
      init: function() {
        this.appendValueInput("text")
            .setCheck(null)
            .appendField("schreibe");
        this.setPreviousStatement(true, null);
        this.setNextStatement(true, null);
        this.setColour(60);
        this.setTooltip("");
        this.setHelpUrl("");
      }
    };

    Blockly.Blocks['string_to_int'] = {
      init: function() {
        this.appendValueInput("text")
            .setCheck("String")
            .appendField("Text zu Ganzzahl");
        this.setOutput(true, "Number");
        this.setColour(40);
        this.setTooltip("");
        this.setHelpUrl("");
      }
    };

    Blockly.Blocks['string_to_float'] = {
      init: function() {
        this.appendValueInput("text")
            .setCheck("String")
            .appendField("Text zu Zahl");
        this.setOutput(true, "Number");
        this.setColour(40);
        this.setTooltip("");
        this.setHelpUrl("");
      }
    };

    var toolbox = document.getElementById("toolbox");
    var blocklyArea = document.getElementById('blocklyArea');

    var options = {
        toolbox : toolbox,
        maxBlocks : Infinity,
        trashcan : true,
        css : true,
        media : 'blockly/media/',
        sounds : true,
        oneBasedIndex : true,
    };

    var workspace = Blockly.inject(blocklyArea, options);
    Blockly.svgResize(workspace);

    var xml_text = localStorage.getItem('bwinf361j1code');
    if (xml_text) {
        var xml = Blockly.Xml.textToDom(xml_text);
        Blockly.Xml.domToWorkspace(xml, workspace);
    }
    var own_code = localStorage.getItem('bwinf361j1code_own');
    if (own_code) {
        editor_own.setValue(own_code,1);
    }

    function myUpdateFunction(event) {
        var code = Blockly.JavaScript.workspaceToCode(workspace);
        editor_gen.setValue(code,1);

        // Save Blocks
        var xml = Blockly.Xml.workspaceToDom(workspace);
        var xml_text = Blockly.Xml.domToText(xml);
        localStorage.setItem('bwinf361j1code', xml_text);
        localStorage.setItem('bwinf361j1code_own', editor_own.getValue());
    }
    workspace.addChangeListener(myUpdateFunction);
    editor_own.getSession().on('change', myUpdateFunction);

    var grid = {
        write: function(x,y,val) {
            var id = 'f' + x + '_' + y;
            document.getElementById(id).textContent = val;
        },
        read: function(x,y) {
            var id = 'f' + x + '_' + y;
            return document.getElementById(id).textContent;
        },
        colourise: function(x,y,colour) {
            var id = 'f' + x + '_' + y;
            document.getElementById(id).parentNode.style.backgroundColor = colour;
            document.getElementById(id).style.backgroundColor = colour;
        }
    }

    var output = {
        write: function(val) {
            document.getElementById("output_area").value += val + "\n";
        },
    }

    var input = {
       commonRead: function() {
            var result = "";
            var area = document.getElementById("input_area");
            console.log(area.value);
            var index = area.value.indexOf('\n');

            if (index < 0) {
              result = area.value;
              area.value = "";
            }
            else {
              result = area.value.substring(0,index);
              area.value = area.value.substring(index+1);
            }
            return result;
        },

        read_string: function() {
            return this.commonRead();
        },


        read_integer: function() {
            return parseInt(this.commonRead());
        },

        read_float: function() {
            return parseFloat(this.commonRead());
        },

        is_end_of_file: function() {
            var area = document.getElementById("input_area");
            var index = area.value.indexOf('\n');

            return index < 0;
        },
    }


    Blockly.JavaScript['write'] = function(block) {
      var text = Blockly.JavaScript.valueToCode(block, 'text', Blockly.JavaScript.ORDER_NONE);
      var code = 'output.write(' + text + ');\n';
      return code;
    };

    Blockly.JavaScript['read_string'] = function(block) {
      var code = 'input.read_string()';
      return [code, Blockly.JavaScript.ORDER_MEMBER];
    };
    Blockly.JavaScript['read_int'] = function(block) {
      var code = 'input.read_int()';
      return [code, Blockly.JavaScript.ORDER_MEMBER];
    };
    Blockly.JavaScript['read_float'] = function(block) {
      var code = 'input.read_float()';
      return [code, Blockly.JavaScript.ORDER_MEMBER];
    };
    Blockly.JavaScript['end_of_file'] = function(block) {
      var code = 'input.is_end_of_file()';
      return [code, Blockly.JavaScript.ORDER_MEMBER];
    };
    Blockly.JavaScript['string_to_int'] = function(block) {
      var text = Blockly.JavaScript.valueToCode(block, 'text', Blockly.JavaScript.ORDER_NONE);
      var code = 'parseInt(' + text + ')';
      return [code, Blockly.JavaScript.ORDER_MEMBER];
    };
    Blockly.JavaScript['string_to_float'] = function(block) {
      var text = Blockly.JavaScript.valueToCode(block, 'text', Blockly.JavaScript.ORDER_NONE);
      var code = 'parseFloat(' + text + ')';
      return [code, Blockly.JavaScript.ORDER_MEMBER];
    };

    var saved_input = "";

    function myRunFunction() {
        saved_input =  document.getElementById("input_area").value;

        Blockly.JavaScript.addReservedWords('code');
          var code = Blockly.JavaScript.workspaceToCode(workspace);

          if (document.getElementById('editor').value == "ownJs") {
            code = editor_own.getValue();
          }


          console.log(code);
        try {
            eval(code);
        } catch (e) {
            alert(e);
        }
    }
    document.getElementById("runButton").onclick = myRunFunction;

    function myClearFunction() {
      document.getElementById('input_area').value = saved_input;
      document.getElementById('output_area').value = "";

    }
    document.getElementById("clearButton").onclick = myClearFunction;


    function mySaveFunction() {
        var xml = Blockly.Xml.workspaceToDom(workspace);
        var xml_text = Blockly.Xml.domToText(xml);
        newWindow = window.open("data:application/octet-stream," + encodeURIComponent(xml_text), 'programm.blockly.xml');
    }
    document.getElementById("saveButton").onclick = mySaveFunction;


    function readSingleFile(e) {
        var file = e.target.files[0];
        if (!file) {
            return;
        }
        var reader = new FileReader();
        reader.onload = function(e) {
            var xml_text = e.target.result;
            if (xml_text) {
                var xml = Blockly.Xml.textToDom(xml_text);
                Blockly.Xml.domToWorkspace(xml, workspace);
            }
        };
        reader.readAsText(file);
    }
    document.getElementById('fileButton').addEventListener('change', readSingleFile, false);


    function changeEditor(e) {
        document.getElementById('blocklyArea').style.display = "none";
        document.getElementById('genJs').style.display = "none";
        document.getElementById('ownJs').style.display = "none";

        document.getElementById(document.getElementById('editor').value).style.display = "block";

        editor_own.resize();
        editor_gen.resize();
        Blockly.svgResize(workspace);
        
    }
    document.getElementById('editor').addEventListener('change', changeEditor, false);

  </script>
</html>
